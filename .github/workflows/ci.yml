name: CI

# このプラグインだけで完結する CI。本体のリポジトリの workflow は呼ばない。
#
# プラグインは go.mod の `replace ... => ../..` で本体を参照するので、本体を
# 取ってきて `plugins/<名前>` に置いて組む。本体の版は下の ELYTHIA_REF で固定する
# (上げ方は README)。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 前提にする本体の版。最新のリリースにする。
  ELYTHIA_REF: "2.0.0"
  PLUGIN_NAME: nowplaying

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mk
          POSTGRES_PASSWORD: mk
          POSTGRES_DB: misskey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: misskey_test
      TEST_DB_USER: mk
      TEST_DB_PASS: mk
      # このプラグインのテストは、DB に繋がらないと skip せずに落ちる (testDB)。

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Elythia-Network/elythia
          ref: ${{ env.ELYTHIA_REF }}
          path: elythia
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elythia/plugins/${{ env.PLUGIN_NAME }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: elythia/plugins/${{ env.PLUGIN_NAME }}/go.mod
          cache-dependency-path: |
            elythia/go.sum
            elythia/plugins/${{ env.PLUGIN_NAME }}/go.sum

      - name: Generate go.work
        working-directory: elythia
        run: ./plugins/"$PLUGIN_NAME"/.github/scripts/workspace.sh

      - name: Test
        working-directory: elythia/plugins/${{ env.PLUGIN_NAME }}
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: Build elythia with this plugin
        working-directory: elythia
        run: go build -o /dev/null ./cmd/elythia

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Elythia-Network/elythia
          ref: ${{ env.ELYTHIA_REF }}
          path: elythia
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elythia/plugins/${{ env.PLUGIN_NAME }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: elythia/plugins/${{ env.PLUGIN_NAME }}/go.mod
          cache-dependency-path: |
            elythia/go.sum
            elythia/plugins/${{ env.PLUGIN_NAME }}/go.sum

      - name: Generate go.work
        working-directory: elythia
        run: ./plugins/"$PLUGIN_NAME"/.github/scripts/workspace.sh

      - name: gofmt
        working-directory: elythia/plugins/${{ env.PLUGIN_NAME }}
        # **go.mod の版の gofmt を使う。** gofmt は版で整形結果が変わる。
        # 構文の誤りでも終了コードが 0 でなくなるので、出力が空でも終了コードを見る。
        run: |
          status=0
          out=$(git ls-files -z '*.go' | xargs -0 "$(go env GOROOT)/bin/gofmt" -s -l) || status=$?
          if [ -n "$out" ]; then
            echo "gofmt -s で整形されていないファイル:"
            echo "$out"
            exit 1
          fi
          exit "$status"

      - name: go vet
        working-directory: elythia/plugins/${{ env.PLUGIN_NAME }}
        run: go vet ./...

      - name: golangci-lint
        working-directory: elythia/plugins/${{ env.PLUGIN_NAME }}
        # 版は本体の Makefile と揃える。設定は本体の .golangci.yml を使う。
        # **toolchain を go.mod の版に固定する。** `go run pkg@version` は
        # golangci-lint 自身の go directive を基準に toolchain を選ぶので、
        # 古い toolchain でビルドされると、新しい標準ライブラリを読めずに落ちる。
        run: |
          gover=$(awk '/^go [0-9]/ {print $2; exit}' go.mod)
          GOTOOLCHAIN="go$gover" go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 \
            run --timeout 10m --config ../../.golangci.yml ./...

      - name: actionlint
        working-directory: elythia/plugins/${{ env.PLUGIN_NAME }}
        run: GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Elythia-Network/elythia
          ref: ${{ env.ELYTHIA_REF }}
          path: elythia
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elythia/plugins/${{ env.PLUGIN_NAME }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: elythia/plugins/${{ env.PLUGIN_NAME }}/go.mod
          cache-dependency-path: |
            elythia/go.sum
            elythia/plugins/${{ env.PLUGIN_NAME }}/go.sum

      - name: Generate go.work
        working-directory: elythia
        run: ./plugins/"$PLUGIN_NAME"/.github/scripts/workspace.sh

      - name: govulncheck
        working-directory: elythia/plugins/${{ env.PLUGIN_NAME }}
        # **このプラグインのパッケージだけを見る。** 本体を丸ごと見ると、本体の
        # 依存の脆弱性で落ちる (2.0.0 では golang.org/x/net の 4 件。プラグイン
        # からは呼ばれていない)。本体の脆弱性は本体の CI が見る。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOOS=linux "$(go env GOPATH)/bin/govulncheck" ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Elythia-Network/elythia
          ref: ${{ env.ELYTHIA_REF }}
          path: elythia
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elythia/plugins/${{ env.PLUGIN_NAME }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: elythia/plugins/${{ env.PLUGIN_NAME }}/go.mod
          cache-dependency-path: |
            elythia/go.sum
            elythia/plugins/${{ env.PLUGIN_NAME }}/go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: elythia/frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: elythia/frontend/.node-version
          cache: pnpm
          cache-dependency-path: elythia/frontend/pnpm-lock.yaml

      # frontend が import する生成物 (server-plugins.generated.ts) を作る。
      - name: Generate go.work and the frontend registry
        working-directory: elythia
        run: ./plugins/"$PLUGIN_NAME"/.github/scripts/workspace.sh

      - name: Install
        working-directory: elythia/frontend
        run: pnpm i --frozen-lockfile

      - name: Build
        working-directory: elythia/frontend
        run: pnpm build

      # プラグインの .vue / .ts は、本体の frontend の tsconfig の別名
      # (`@mkplugin/*` → `plugins/*/frontend`) から読まれる。
      - name: typecheck
        working-directory: elythia/frontend
        run: pnpm --filter frontend run typecheck

      # **本体の src/ の下へ写してから当てる。** 本体の eslint の設定は
      # `src/**` だけを対象にし、設定ファイルのディレクトリの外のファイルは
      # 無視するので、plugins/ の下のままでは何も検査しない。行番号は元の
      # ファイルと同じで、パスだけが src/_plugin_lint/<名前>/ になる。
      - name: eslint
        working-directory: elythia/frontend/packages/frontend
        run: |
          dest="src/_plugin_lint/$PLUGIN_NAME"
          mkdir -p "$(dirname "$dest")"
          cp -R "../../../plugins/$PLUGIN_NAME/frontend" "$dest"
          pnpm exec eslint "$dest"
